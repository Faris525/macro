<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Macro</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Macro">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0E1013">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Layout: single phone column (max 520px), sticky top bar, fixed bottom tab bar; flat dark cards. One dark look by choice (option C). */
:root{
  --bg:#0E1013; --surface:#1A1D22; --surface-2:#24282E; --ink:#F2F4F6; --ink-2:#C3C9D1; --ink-3:#9BA3AE; --line:#2A2F36;
  --accent:#4C93FF; --accent-ink:#0E1013; --accent-soft:#1A2A45;
  --pro:#FF6B6F; --carb:#F5B43A; --fat:#2CC9C4;
  --good:#3FC27C; --warn:#F0A63A; --bad:#FF6B6F; --sim:#B597FF; --sim-soft:#2A2140;
  --shadow:none;
  --font-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,system-ui,sans-serif;
  --font-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  --r-lg:12px; --r-md:12px; --r-sm:10px;
  --nav-h:64px;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--font-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.tab{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

#app{max-width:520px;margin:0 auto;padding-bottom:calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px))}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:12px 10px}
.brand{font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase}
.topbar .spacer{flex:1}
.pagehead{font-family:var(--font-display);font-weight:700;font-size:28px;line-height:1.1;letter-spacing:-.02em}
.sub{color:var(--ink-2);font-size:14px}
.tiny{font-size:12.5px;color:var(--ink-3)}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.card{background:var(--surface);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none;border:0}
.section{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.section > .sechead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding-inline:2px}
.sechead h2{font-family:var(--font-display);font-weight:600;font-size:17px;letter-spacing:0}

/* status pill */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.good{color:var(--good)} .pill.warn{color:var(--warn)} .pill.sim{color:var(--sim);background:var(--sim-soft)} .pill.acc{color:var(--accent);background:var(--accent-soft)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;border:0;background:var(--surface-2);color:var(--ink);font-weight:600;font-size:16px;text-decoration:none}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{background:transparent;border:1px solid var(--bad);color:var(--bad)}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:default}
.linkbtn{background:none;border:0;padding:4px 0;color:var(--accent);font-weight:600;font-size:14px}
.iconbtn{width:40px;height:40px;border-radius:12px;border:0;background:var(--surface-2);display:inline-grid;place-items:center}
.iconbtn svg{width:20px;height:20px}

/* fuel card */
.fuel{padding:20px 18px 18px}
.fuel .big{font-family:var(--font-display);font-stretch:62%;font-weight:850;font-size:68px;line-height:.86;letter-spacing:-.01em}
.fuel .of{font-family:var(--font-display);font-stretch:80%;font-weight:600;font-size:17px;color:var(--ink-2)}
.fuel .left{text-align:right}
.fuel .left .v{font-family:var(--font-display);font-stretch:70%;font-weight:800;font-size:34px;line-height:1}
.platebar{position:relative;height:16px;border-radius:6px;background:var(--surface-2);margin:16px 0 4px;overflow:hidden;display:flex}
.platebar span{height:100%}
.platebar .p{background:var(--pro)} .platebar .c{background:var(--carb)} .platebar .f{background:var(--fat)}
.platebar.over{box-shadow:inset 0 0 0 2px var(--bad)}
.platescale{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-3)}
.macros{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}
.macro .lbl{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.macro .sw{width:9px;height:9px;border-radius:3px}
.macro .val{font-family:var(--font-display);font-stretch:75%;font-weight:800;font-size:25px;line-height:1.05;margin-top:2px}
.macro .val small{font-family:var(--font-body);font-size:12.5px;font-weight:500;color:var(--ink-3);font-stretch:100%}
.macro .bar{height:5px;border-radius:3px;background:var(--surface-2);margin-top:6px;overflow:hidden}
.macro .bar i{display:block;height:100%;border-radius:3px}
.macro .rem{font-size:12.5px;color:var(--ink-3);margin-top:4px}

/* nudge */
.nudge{background:var(--accent-soft);border-radius:var(--r-lg);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.nudge .when{font-family:var(--font-display);font-stretch:85%;font-weight:800;font-size:21px;line-height:1.1}
.nudge .combo{background:var(--surface);border-radius:var(--r-md);padding:11px 13px;display:flex;flex-direction:column;gap:3px}
.nudge .combo b{font-weight:650}
.nudge .combo .tiny{color:var(--ink-2)}
.timeline{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.timeline::-webkit-scrollbar{display:none}
.tl{flex:0 0 auto;font-size:12px;padding:5px 9px;border-radius:9px;background:var(--surface);color:var(--ink-2);display:flex;gap:6px;align-items:center}
.tl.done{text-decoration:line-through;color:var(--ink-3)}
.tl.next{background:var(--accent);color:var(--accent-ink);font-weight:650}

/* meals */
.meal{display:flex;flex-direction:column}
.mealhead{display:flex;align-items:baseline;gap:8px;padding:2px 2px 8px}
.mealhead h3{font-size:15px;font-weight:650}
.mealhead .k{margin-left:auto;font-size:14px;color:var(--ink-2)}
.items{background:var(--surface);border-radius:var(--r-md);overflow:hidden;box-shadow:var(--shadow)}
.item{display:flex;align-items:center;gap:12px;padding:11px 14px;border:0;background:none;width:100%;text-align:left;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .thumb{width:42px;height:42px;border-radius:10px;object-fit:cover;flex:0 0 auto;background:var(--surface-2)}
.item .nm{font-weight:600;font-size:15px;line-height:1.25;overflow-wrap:anywhere}
.item .mx{font-size:12.5px;color:var(--ink-3)}
.item .kc{font-family:var(--font-display);font-stretch:75%;font-weight:750;font-size:19px;white-space:nowrap}
.empty{border:1.5px dashed var(--line);border-radius:var(--r-md);padding:16px;text-align:center;color:var(--ink-3);font-size:14px}
.src{display:inline-flex;align-items:center;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:5px;background:var(--surface-2);color:var(--ink-2);margin-left:4px;vertical-align:1px}
.src.off{background:var(--accent-soft);color:var(--accent)}
.src.sim{background:var(--sim-soft);color:var(--sim)}
.src.lab{background:color-mix(in srgb,var(--fat) 16%,transparent);color:var(--fat)}

/* day nav */
.daynav{display:flex;align-items:center;gap:8px}
.daynav .d{font-weight:650;font-size:15px;min-width:0;text-align:center}

/* forms */
.field{display:flex;flex-direction:column;gap:6px}
.field > label,.lab{font-size:13.5px;font-weight:600;color:var(--ink-2)}
.input{width:100%;min-height:50px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:17px}
.input:focus{border-color:var(--accent);outline:none}
.input.err{border-color:var(--bad)}
textarea.input{min-height:96px;resize:vertical;line-height:1.4}
.withunit{position:relative}
.withunit .u{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--ink-3);font-size:15px;pointer-events:none}
.withunit .input{padding-right:52px}
.ferr{color:var(--bad);font-size:13px;font-weight:550}
.fhint{color:var(--ink-3);font-size:12.5px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;min-height:40px;border:0;border-radius:9px;background:transparent;font-weight:600;font-size:14.5px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface)}
.choice[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.choice .t{font-weight:650}
.choice .d{font-size:13.5px;color:var(--ink-2)}
.choice .mark{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:0 0 auto;margin-top:1px}
.choice[aria-pressed="true"] .mark{border:6px solid var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13.5px;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 0}
.switch{width:50px;height:30px;border-radius:999px;border:0;background:var(--line);position:relative;flex:0 0 auto}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .18s}
.switch[aria-checked="true"]{background:var(--good)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}

/* onboarding */
.ob{min-height:100%;display:flex;flex-direction:column;gap:18px;padding-top:6px}
.obprog{display:flex;gap:5px}
.obprog i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.obprog i.on{background:var(--accent)}
.obtitle{font-family:var(--font-display);font-weight:700;font-size:30px;line-height:1.1;letter-spacing:-.02em}
.obfoot{display:flex;gap:10px;margin-top:6px}
.hero{padding:22px 0 6px}
.hero .word{font-family:var(--font-display);font-weight:800;font-size:min(20vw,92px);line-height:.9;letter-spacing:-.03em}
.hero .word span{color:var(--accent)}

/* results */
.stat3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border-radius:var(--r-md);padding:12px;box-shadow:var(--shadow)}
.stat .v{font-family:var(--font-display);font-stretch:72%;font-weight:800;font-size:26px;line-height:1.05}
.stat .k{font-size:12px;color:var(--ink-3);font-weight:600}
.kv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14.5px}
.kv:first-child{border-top:0}
.kv .k{color:var(--ink-2)}
.kv .v{font-weight:600;text-align:right}

/* log */
.tabs3{margin-bottom:4px}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:190px;border-radius:var(--r-lg);border:2px dashed var(--line);background:var(--surface);text-align:center;padding:18px;position:relative;overflow:hidden}
.drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.drop input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.drop .ic{width:46px;height:46px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.preview{background:var(--surface);border-radius:var(--r-md);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.reviewitem{background:var(--surface);border-radius:var(--r-md);padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.reviewitem .top{display:flex;gap:10px;align-items:flex-start}
.reviewitem .nm{font-weight:650;font-size:16px;overflow-wrap:anywhere}
.reviewitem .note{font-size:12.5px;color:var(--ink-3)}
.reviewitem .note a,a.srclink{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.mini4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;text-align:center}
.mini4 div{background:var(--surface-2);border-radius:9px;padding:6px 2px}
.mini4 b{display:block;font-family:var(--font-display);font-stretch:75%;font-size:18px;font-weight:800}
.mini4 span{font-size:11px;color:var(--ink-3)}
.gramrow{display:flex;align-items:center;gap:8px}
.gramrow .input{min-height:44px;text-align:center}
.banner{border-radius:var(--r-md);padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.banner.sim{background:var(--sim-soft);color:var(--ink)}
.banner.sim b{color:var(--sim)}
.banner.info{background:var(--accent-soft)}
.banner.warn{background:color-mix(in srgb,var(--warn) 14%,transparent)}
.spinner{width:22px;height:22px;border-radius:50%;border:3px solid var(--accent-soft);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* weight */
.wentry{display:flex;align-items:stretch;gap:10px}
.wentry .input{font-family:var(--font-display);font-stretch:75%;font-weight:800;font-size:34px;text-align:center;min-height:68px}
.wentry .step{width:56px;min-height:68px;border-radius:14px;border:0;background:var(--surface-2);font-size:26px;font-weight:600}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--ink-3);font-size:10.5px;font-family:var(--font-body)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .trend{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:var(--accent);opacity:.08}
.chart .pt{fill:var(--ink-3)}
.chart .goal{stroke:var(--good);stroke-dasharray:4 4;stroke-width:1.5}
.chart .end{fill:var(--accent);stroke:var(--surface);stroke-width:3}
.wlist .kv .v{font-family:var(--font-display);font-stretch:80%;font-weight:750}

/* history */
.hday{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow);overflow:hidden}
.hday > button{display:flex;flex-direction:column;gap:7px;width:100%;border:0;background:none;padding:13px 14px;text-align:left}
.hday .r1{display:flex;align-items:baseline;gap:8px;width:100%}
.hday .r1 .dt{font-weight:650}
.hday .r1 .kc{margin-left:auto;font-family:var(--font-display);font-stretch:78%;font-weight:800;font-size:19px}
.hbar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;width:100%}
.hbar i{display:block;height:100%;background:var(--ink-2)}
.hbar i.ok{background:var(--good)} .hbar i.lo{background:var(--warn)} .hbar i.hi{background:var(--bad)}
.hday .r3{font-size:12.5px;color:var(--ink-3);display:flex;gap:12px;flex-wrap:wrap}
.hday .body{border-top:1px solid var(--line)}

/* settings */
.setlist{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow);overflow:hidden}
.setrow{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border:0;background:none;text-align:left;border-top:1px solid var(--line)}
.setrow:first-child{border-top:0}
.setrow .k{font-weight:600}
.setrow .v{margin-left:auto;color:var(--ink-2);font-size:14.5px;text-align:right;min-width:0}
.setrow .chev{color:var(--ink-3);flex:0 0 auto}
.integ{display:flex;flex-direction:column;gap:10px}
.integ .logo{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-family:var(--font-display);font-weight:900;font-stretch:120%;font-size:13px;background:var(--ink);color:var(--bg);flex:0 0 auto}
.maptable{width:100%;border-collapse:collapse;font-size:13px}
.maptable td{padding:7px 0;border-top:1px solid var(--line);vertical-align:top}
.maptable td:first-child{color:var(--ink-2);padding-right:10px;width:42%}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h);align-items:center}
.nav a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--ink-3);text-decoration:none;padding:6px 0}
.nav a svg{width:23px;height:23px}
.nav a[aria-current="page"]{color:var(--ink)}
.nav a.logbtn{color:var(--accent-ink)}
.nav a.logbtn span.b{width:54px;height:42px;border-radius:15px;background:var(--accent);display:grid;place-items:center}
.nav a.logbtn svg{width:24px;height:24px}

/* sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(8,11,15,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:92%;overflow-y:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:10px max(18px,env(safe-area-inset-left,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 4px}
.sheet h2{font-family:var(--font-display);font-stretch:90%;font-weight:800;font-size:24px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}

.toast{display:flex;align-items:center;gap:14px;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14px;font-weight:600;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.toastbtn{background:none;border:0;color:#1F5FD6;font-weight:700;padding:4px 0;font-size:14px}
.quick{display:flex;flex-wrap:wrap;gap:8px}
.qbtn{flex:1 1 150px;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px 14px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface);text-align:left;box-shadow:var(--shadow)}
.qbtn b{font-weight:650;font-size:14.5px;overflow-wrap:anywhere}
.qbtn b::before{content:"+ ";color:var(--accent)}
.qbtn span{font-size:12.5px;color:var(--ink-3)}
.qbtn.ghost{background:transparent;border-style:dashed;box-shadow:none}
.micbtn svg{width:18px;height:18px}

function selMacros() {

function selPanelHtml() {

  if (x.lastG) chips.push([`Last time · ${fmt(x.lastG)} g`, x.lastG]);

function bindLog() {
  const app = $("#app");
  const ta = $("#logtext");
  if (ta) ta.oninput = () => { S.log.text = ta.value; S.log.error = null; $("#quickprev").innerHTML = quickPreview(parseFoodText(ta.value), ta.value); const q = parseFoodText(ta.value); $('[data-act="use-quick"]').disabled = !q.items.length; $('[data-act="ai-text"]').disabled = !ta.value.trim() || S.log.busy; };
  const pn = $("#photonote"); if (pn) pn.oninput = () => S.log.note = pn.value;
  const pin = $("#photoin");
  if (pin) pin.onchange = async () => {
    const f = pin.files && pin.files[0]; if (!f) return;
    if (!/^image\//.test(f.type) && !/\.(heic|jpe?g|png|webp)$/i.test(f.name)) { S.log.error = "That file isn't an image."; render(); return; }
    try { const r = await imageToBlob(f); S.log.photo = r.blob; S.log.photoThumb = r.thumb; S.log.photoPreview = r.preview; S.log.error = null; }
    catch { S.log.error = "Couldn't open that image. Try a JPEG or PNG."; }
    render();
  };
  const fq = $("#fq");
  if (fq) fq.oninput = () => { S.log.search.q = fq.value; $("#fres").innerHTML = searchResultsHtml(); };
  bindSelInput();
  for (const id of ["qname", "qkcal", "qp", "qc", "qf"]) { const el = $("#" + id); if (el) el.oninput = () => S.log.quick[{ qname: "name", qkcal: "kcal", qp: "p", qc: "c", qf: "f" }[id]] = el.value; }
  const rn = $("#rname"); if (rn) rn.oninput = () => S.log.review.name = rn.value;
  $$("input[id^=g]").forEach(inp => { if (!/^g\d+$/.test(inp.id)) return; inp.onchange = () => { const i = +inp.dataset.i; setGrams(i, parseNum(inp.value)); }; });
  app.onclick = async e => {
    const b = e.target.closest("[data-act]"); if (!b) return;
    const a = b.dataset.act, L = S.log;
    if (a === "tab") { L.tab = b.dataset.tab; L.error = null; render(); }
    if (a === "logtoday") { S.viewDate = todayKey(); render(); }
    if (a === "mic") startVoice();
    if (a === "managemeals") openMealsSheet();
    if (a === "usesaved") { const m = savedMeals().find(x => x.id === b.dataset.id); if (m) { logWithUndo(S.viewDate, m.items, m.name, m.name); go("today"); } }
    if (a === "rsave") { L.review.saveAs = !L.review.saveAs; render(); }
    if (a === "example") { L.text = b.dataset.v; render(); }
    if (a === "use-quick") { const q = parseFoodText(L.text); L.review = { mode: "local", meal: null, items: q.items }; render(); }
    if (a === "ai-text") await runTextAI();
    if (a === "ai-photo") await runPhotoAI();
    if (a === "clearphoto") { L.photo = null; L.photoThumb = null; L.photoPreview = null; render(); }
    const S2 = L.search;
    if (a === "pickfood") { const list = S2.res?.[b.dataset.k] || []; const x = list[+b.dataset.i]; if (x) pickFood(x); }
    if (a === "unpick") { S2.sel = null; $("#fsel").innerHTML = ""; }
    if (a === "fgset") { S2.grams = b.dataset.g; $("#fg").value = b.dataset.g; $("#fmac").innerHTML = selMacros(); }
    if (a === "fg-" || a === "fg+") { const g = parseNum(S2.grams) || 0; const step = g >= 200 ? 25 : 10; S2.grams = String(Math.max(1, Math.round(g + (a === "fg+" ? step : -step)))); $("#fg").value = S2.grams; $("#fmac").innerHTML = selMacros(); }
    if (a === "addbasket") {
      const x = S2.sel, g = parseNum(S2.grams); if (!x || !isFinite(g) || g < 1 || g > 3000) return;
      const k = g / 100;
      S2.basket.push({ id: uid(), name: x.name, brand: x.brand || null, grams: Math.round(g), kcal: Math.round(x.per100.kcal * k), p: round(x.per100.p * k, 1), c: round(x.per100.c * k, 1), f: round(x.per100.f * k, 1), source: x.kind === "db" ? "database" : (x.source === "simulated" ? "manual" : x.source || "manual"), per100: { ...x.per100 } });
      S2.sel = null; S2.q = ""; render(); toast(`Added ${shortName(x.name)}`);
    }
    if (a === "rmbasket") { S2.basket.splice(+b.dataset.i, 1); render(); }
    if (a === "reviewbasket") { L.review = { mode: "local", meal: null, items: S2.basket.map(i => ({ ...i })) }; S2.basket = []; render(); window.scrollTo(0, 0); }
    if (a === "togglemanual") { S2.manual = !S2.manual; render(); }
    if (a === "q2text") { L.text = S2.q; L.tab = "text"; render(); }
    if (a === "q2photo") { L.tab = "photo"; render(); }
    if (a === "quickadd") {
      const it = { name: L.quick.name.trim(), kcal: L.quick.kcal, p: L.quick.p || "0", c: L.quick.c || "0", f: L.quick.f || "0", grams: "" };
      const err = validateItem(it); if (err) { $("#qerr").textContent = err; return; }
      S2.basket.push({ id: uid(), name: it.name, kcal: Math.round(parseNum(it.kcal)), p: parseNum(it.p), c: parseNum(it.c), f: parseNum(it.f), grams: 0, source: "manual" });
      L.quick = { name: "", kcal: "", p: "", c: "", f: "" }; render(); toast(`Added ${it.name}`);
    }
    if (a === "rm") { L.review.items.splice(+b.dataset.i, 1); render(); }
    if (a === "g-" || a === "g+") { const i = +b.dataset.i, it = L.review.items[i]; const step = it.grams >= 200 ? 25 : 10; setGrams(i, Math.max(1, it.grams + (a === "g+" ? step : -step))); }
    if (a === "discard") { L.review = null; render(); }
    if (a === "edit-review") openReviewItemSheet(+b.dataset.i);
    if (a === "add-review-item") openReviewItemSheet(-1);
    if (a === "save-review") {
      const R = L.review, name = (($("#rname")?.value) || R.name || "").trim() || autoMealName(R.items);
      const items = R.items.map((i, n) => { const { confidence, ...rest } = i; return { ...rest, img: n === 0 && R.thumb ? R.thumb : undefined }; }).map(i => { if (!i.img) delete i.img; if (!i.per100) delete i.per100; return i; });
      let label = name;
      if (R.saveAs) { await saveMeal(name, items); label = `Saved “${name}” and logged`; }
      logWithUndo(S.viewDate, items, name, label);
      Object.assign(L, { review: null, text: "", photo: null, photoThumb: null, photoPreview: null, note: "", error: null });
      go("today");
    }
  };
}
function setGrams(i, g) {
  const it = S.log.review.items[i]; if (!it || !it.per100 || !isFinite(g)) return;
  g = clamp(Math.round(g), 1, 3000); const k = g / 100;
  Object.assign(it, { grams: g, kcal: Math.round(it.per100.kcal * k), p: round(it.per100.p * k, 1), c: round(it.per100.c * k, 1), f: round(it.per100.f * k, 1) });
  render();
}
async function runTextAI() {
  const L = S.log; const text = L.text.trim(); if (!text) return;
  if (!S.ai.sample || S.ai.denied) { // simulated: honest placeholder built from the local parser
    const q = parseFoodText(text);
    L.review = { mode: "sim", meal: "Simulated analysis", items: (q.items.length ? q.items : [{ id: uid(), name: text.slice(0, 60), grams: 300, kcal: 600, p: 30, c: 60, f: 25, per100: { kcal: 200, p: 10, c: 20, f: 8.33 } }]).map(i => ({ ...i, source: "simulated", note: "Placeholder: live AI isn't available in this view." })) };
    render(); return;
  }
  L.busy = true; L.error = null; render();
  try {
    const r = await aiCall(aiPromptText(text, S.profile.region || regionGuess()));
    const n = normalizeAI(r);
    L.review = { mode: "ai", ...n };
  } catch (e) {
    if (S.ai.denied) { L.busy = false; return runTextAI(); }
    L.error = aiErrorText(e);
  }
  L.busy = false; render();
}
async function runPhotoAI() {
  const L = S.log; if (!L.photo) return;
  if (!S.ai.sample || S.ai.denied || !S.ai.images) {
    const sim = simulatedPhoto(L.note);
    L.review = { mode: "sim", ...sim, thumb: L.photoThumb, preview: L.photoPreview }; render(); return;
  }
  L.busy = true; L.error = null; render();
  try {
    const r = await aiCall(aiPromptPhoto(L.note.trim(), S.profile.region || regionGuess()), { images: [L.photo] });
    const n = normalizeAI(r);
    L.review = { mode: "ai", ...n, thumb: L.photoThumb, preview: L.photoPreview };
  } catch (e) {
    if (S.ai.denied) { L.busy = false; return runPhotoAI(); }
    L.error = aiErrorText(e);
  }
  L.busy = false; render();
}

  root.querySelector(".scrim").addEventListener("click", e => { if (e.target.dataset.close) closeSheet(); });

function readItemForm(sh, orig) {

function voiceHintHtml() {
  return `<div class="banner info"><div><b>Tap the microphone key on your keyboard</b> and say everything you ate, e.g. “200 grams of chicken, a cup of rice and a tablespoon of olive oil”. Then tap Analyse.</div></div>`;

function showVoiceHint() { S.voice.hint = true; const h = $("#voicehint"); if (h) h.innerHTML = voiceHintHtml(); }
function updateMicBtn() { const b = $("#micbtn"); if (!b) return; b.classList.toggle("on", S.voice.on); b.querySelector("span").textContent = S.voice.on ? "Stop" : "Speak"; }
function startVoice() {
  const ta = $("#logtext"); if (!ta) return;
  if (S.voice.on && S.voice.rec) { try { S.voice.rec.stop(); } catch { } return; }
  ta.focus(); // inside the tap, so iOS opens the keyboard (with its dictation key)
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR || S.voice.blocked) { showVoiceHint(); return; }
  const block = () => { S.voice.blocked = true; lsSet("macro.voiceBlocked", true); S.voice.on = false; updateMicBtn(); showVoiceHint(); };
  let rec; try { rec = new SR(); } catch { block(); return; }
  const base = ta.value.trim();
  rec.lang = navigator.language || "en-US"; rec.interimResults = true; rec.continuous = true;
  rec.onresult = e => { let txt = ""; for (const r of e.results) txt += r[0].transcript + " "; ta.value = (base ? base + ", " : "") + txt.trim(); ta.dispatchEvent(new Event("input")); };
  rec.onerror = e => { if (["not-allowed", "service-not-allowed", "audio-capture"].includes(e.error)) block(); };
  rec.onend = () => { S.voice.on = false; S.voice.rec = null; updateMicBtn(); };
  try { rec.start(); S.voice.on = true; S.voice.rec = rec; updateMicBtn(); } catch { block(); }
}

function niceStep(range, target = 4) {
  const raw = range / target; const p = 10 ** Math.floor(Math.log10(raw)); const n = raw / p;
  return (n < 1.5 ? 1 : n < 3 ? 2 : n < 7 ? 5 : 10) * p;
}
function weightChart(units) {
  const ws = weightStats(S.weights); const range = S.ui.wRange;
  const W = 340, H = 196, L = 40, Rr = 12, T = 14, B = 26;
  if (!ws.tr.length) {
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight trend chart, no data yet">
      ${[0, 1, 2, 3].map(i => `<line class="grid" x1="${L}" x2="${W - Rr}" y1="${T + i * (H - T - B) / 3}" y2="${T + i * (H - T - B) / 3}" stroke-dasharray="3 5"/>`).join("")}
      <text x="${W / 2}" y="${H / 2 - 4}" text-anchor="middle" style="font-size:13px;font-weight:600;fill:var(--ink-2)">No weigh-ins yet</text>
      <text x="${W / 2}" y="${H / 2 + 14}" text-anchor="middle">Your trend line starts with your first morning weight.</text></svg>`;
  }
  const lastK = ws.tr[ws.tr.length - 1].k;
  const from = range === "2w" ? addDays(lastK, -13) : range === "1m" ? addDays(lastK, -29) : range === "3m" ? addDays(lastK, -89) : ws.tr[0].k;
  const pts = ws.tr.filter(p => p.k >= from);
  let x0 = pts[0].k, x1 = lastK; if (x0 === x1) { x0 = addDays(x1, -3); x1 = addDays(x1, 3); }
  const span = Math.max(1, daysBetween(x0, x1));
  const vals = pts.flatMap(p => [p.v, p.t]).map(v => kgToDisp(v, units));
  const goal = S.profile.goalWeightKg ? kgToDisp(S.profile.goalWeightKg, units) : null;
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (goal != null && Math.abs(goal - (lo + hi) / 2) < Math.max(3, (hi - lo) * 1.5)) { lo = Math.min(lo, goal); hi = Math.max(hi, goal); }
  if (hi - lo < 1) { const m = (hi + lo) / 2; lo = m - 0.5; hi = m + 0.5; }
  const step = niceStep(hi - lo, 4); lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  const X = k => L + daysBetween(x0, k) / span * (W - L - Rr);
  const Y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  const ticks = []; for (let v = lo; v <= hi + 1e-9; v += step) ticks.push(v);
  const dec = step < 1 ? 1 : 0;
  const line = pts.map((p, i) => `${i ? "L" : "M"}${X(p.k).toFixed(1)},${Y(kgToDisp(p.t, units)).toFixed(1)}`).join("");
  const area = pts.length > 1 ? `${line}L${X(pts[pts.length - 1].k).toFixed(1)},${H - B}L${X(pts[0].k).toFixed(1)},${H - B}Z` : "";
  const last = pts[pts.length - 1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight trend chart">
    ${ticks.map(v => `<line class="grid" x1="${L}" x2="${W - Rr}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L - 6}" y="${Y(v) + 3.5}" text-anchor="end" class="num">${v.toFixed(dec)}</text>`).join("")}
    ${goal != null && goal >= lo && goal <= hi ? `<line class="goal" x1="${L}" x2="${W - Rr}" y1="${Y(goal)}" y2="${Y(goal)}"/><text x="${W - Rr}" y="${Y(goal) - 5}" text-anchor="end" style="fill:var(--good)">Goal</text>` : ""}
    ${area ? `<path class="area" d="${area}"/>` : ""}
    ${pts.map(p => `<circle class="pt" cx="${X(p.k).toFixed(1)}" cy="${Y(kgToDisp(p.v, units)).toFixed(1)}" r="2.6"/>`).join("")}
    ${pts.length > 1 ? `<path class="trend" d="${line}"/>` : ""}
    <circle class="end" cx="${X(last.k).toFixed(1)}" cy="${Y(kgToDisp(last.t, units)).toFixed(1)}" r="5.5"/>
    <text x="${L}" y="${H - 8}">${shortDate(x0)}</text><text x="${W - Rr}" y="${H - 8}" text-anchor="end">${shortDate(x1)}</text>
  </svg>`;
}

  else if (f == null) f = Math.round((k - pr * 4 - c * 4) / 9);
  if (f < 20 || f > 300) return { err: auto.f ? `That leaves ${fmt(f)} g fat, outside 20–300 g. Adjust protein or carbs, or calories.` : "Fat must be between 20 and 300 g." };
  if (c < 0 || c > 900) return { err: auto.c ? `That leaves ${fmt(c)} g carbs, outside 0–900 g. Adjust protein or fat, or calories.` : "Carbs must be between 0 and 900 g." };
  const sum = pr * 4 + c * 4 + f * 9;
  if (!auto.c && !auto.f && Math.abs(sum - k) / k > 0.08) return { err: `Your macros add up to ${fmt(sum)} kcal, but calories say ${fmt(k)}. Get them within 8%, or leave carbs or fat empty to fill automatically.` };
  return { t: { kcal: Math.round(k), protein: Math.round(pr), carbs: Math.round(c), fat: Math.round(f) }, auto };
}
function ownTargetSummary(raw) {
  if (!raw || (raw.kcal == null || raw.kcal === "") && (raw.protein == null || raw.protein === "")) return "Carbs and fat can be left empty; Macro fills them from what's left.";
  const r = parseOwnTargets(raw); if (!r.t) return "";
  const fill = [r.auto.c ? "carbs" : null, r.auto.f ? "fat" : null].filter(Boolean);
  return `Works out to ${fmt(r.t.kcal)} kcal · P ${r.t.protein} · C ${r.t.carbs} · F ${r.t.fat} g${fill.length ? ` (${fill.join(" and ")} filled in)` : ""}.`;
}
const readOwnRaw = root => ({ kcal: root.querySelector("#tk")?.value ?? "", protein: root.querySelector("#tp")?.value ?? "", carbs: root.querySelector("#tc")?.value ?? "", fat: root.querySelector("#tf")?.value ?? "" });
function bindOwnTargets(root, onChange) {
  ["tk", "tp", "tc", "tf"].forEach(id => { const el = root.querySelector("#" + id); if (el) el.addEventListener("input", () => { const raw = readOwnRaw(root); root.querySelector("#tsum").textContent = ownTargetSummary(raw); setErr(root, "t", ""); onChange && onChange(raw); }); });
}

function routineFields(r) {
  return `<div class="grid2"><div class="field"><label for="rw">Usually up at</label><input id="rw" type="time" class="input" value="${r.wake}"></div>
    <div class="field"><label for="rs">Usually asleep by</label><input id="rs" type="time" class="input" value="${r.sleep}"></div></div><div class="ferr" data-err="rt"></div>`;
}
function readRoutine(sh) { const wake = sh.querySelector("#rw").value, sleep = sh.querySelector("#rs").value; if (!wake || !sleep) { setErr(sh, "rt", "Set both times."); return null; } if (setErr(sh, "rt", V.routine(wake, sleep))) return null; return { wake, sleep }; }

/* =========================================================
   Onboarding
   ========================================================= */
const obSteps = d => d.targetMode === "own" ? ["welcome", "body", "goal", "routine", "result"] : ["welcome", "body", "activity", "goal", "known", "routine", "result"];
function obInit() {
  if (S.ob) return;
  const saved = lsGet("macro.ob");
  S.ob = saved && saved.d ? saved : { step: 0, d: { units: regionGuess() === "United States" ? "us" : "metric", sex: "", activity: "", goal: "", pace: "", routine: { ...DEFAULT_ROUTINE }, reminders: true } };
}
const obSave = () => lsSet("macro.ob", S.ob);
function renderOnboarding() {
  obInit();
  const { step, d } = S.ob; const STEPS = obSteps(d); const id = STEPS[step]; const u = d.units;
  const prog = `<div class="obprog">${STEPS.slice(1).map((_, i) => `<i class="${i < step ? "on" : ""}"></i>`).join("")}</div>`;
  const back = step > 0 ? `<button class="btn ghost" data-ob="back">Back</button>` : "";
  let body = "";
  if (id === "welcome") body = `<div class="hero"><div class="word">MAC<span>RO</span></div></div>
    <div class="obtitle">Eat for the body you're building.</div>
    <p class="sub">Two minutes of setup. Get calorie and macro targets for bulking, cutting or maintaining, or bring your own, and track against them.</p>
    <div class="field"><label for="obname">What should we call you? <span class="tiny">(optional)</span></label><input id="obname" class="input" value="${esc(d.name || "")}" autocomplete="given-name"></div>
    <div class="field"><span class="lab">Your calorie and macro targets</span><div class="choices" data-group="tmode">
      <button class="choice" type="button" data-v="calc" aria-pressed="${d.targetMode !== "own"}"><span class="mark"></span><span><span class="t">Calculate them for me</span><br><span class="d">From your body, activity and goal. Adapts as your weight moves.</span></span></button>
      <button class="choice" type="button" data-v="own" aria-pressed="${d.targetMode === "own"}"><span class="mark"></span><span><span class="t">I have my own targets</span><br><span class="d">From a coach, another app or your own plan. Macro just tracks.</span></span></button></div></div>
    <div class="field"><span class="lab">Units</span><div class="seg" data-units><button type="button" data-u="metric" aria-pressed="${u !== "us"}">Metric · kg, cm</button><button type="button" data-u="us" aria-pressed="${u === "us"}">US · lb, ft/in</button></div></div>
    <p class="tiny">${S.mode === "account" ? "Everything saves privately to your Claude account." : STANDALONE ? "Everything saves on this phone. Use Back up data under You to keep a copy." : "This view can't reach your account, so everything saves in this browser."}</p>`;
  if (id === "body") body = `<div class="obtitle">Your body</div><p class="sub">${d.targetMode === "own" ? "Used for BMI and your weight trend." : "Used to estimate how much energy you burn."}</p>
    <div class="field"><span class="lab">Sex for energy equations</span><div class="seg" data-sex><button type="button" data-s="male" aria-pressed="${d.sex === "male"}">Male</button><button type="button" data-s="female" aria-pressed="${d.sex === "female"}">Female</button></div><div class="ferr" data-err="sex"></div></div>
    <div class="field"><label for="age">Age</label><div class="withunit"><input id="age" class="input" inputmode="numeric" value="${d.age ?? ""}"><span class="u">years</span></div><div class="ferr" data-err="age"></div></div>
    ${fieldHeight(u, d.heightCm)}
    <div class="field"><label for="wt">Current weight</label><div class="withunit"><input id="wt" class="input" inputmode="decimal" value="${d.weightKg ? kgToDisp(d.weightKg, u).toFixed(1) : ""}"><span class="u">${wUnit(u)}</span></div><div class="ferr" data-err="w"></div></div>`;
  if (id === "activity") body = `<div class="obtitle">How active is a normal week?</div><p class="sub">Count training and your day job or studies together.</p>${choiceList("act", ACTIVITY, d.activity)}<div class="ferr" data-err="act"></div>`;
  if (id === "goal") { const bmi = bmiOf(d.weightKg, d.heightCm);
    const ph = PHASES.find(x => x.id === d.phase);
    body = `<div class="obtitle">${d.targetMode === "own" ? "Your phase and targets" : "Choose your phase"}</div>${d.targetMode === "own" ? `<p class="sub">The phase tells Macro which way your weight should move, so it can read your trend.</p>` : ""}${choiceList("phase", PHASES.map(x => x.goal === "cut" && bmi < 18.5 ? { ...x, d: "Not offered at a BMI under 18.5." } : x), d.phase)}<div class="ferr" data-err="goal"></div>
    ${ph?.caution ? `<div class="banner warn"><div><b>Aggressive cut:</b> ${esc(ph.caution)}</div></div>` : ""}
    ${d.goal ? `${d.goal !== "maintain" ? `<div class="field"><label for="gw">Goal weight <span class="tiny">(optional)</span></label><div class="withunit"><input id="gw" class="input" inputmode="decimal" value="${d.goalWeightKg ? kgToDisp(d.goalWeightKg, u).toFixed(1) : ""}"><span class="u">${wUnit(u)}</span></div><div class="ferr" data-err="gw"></div></div>` : ""}` : ""}
    ${d.targetMode === "own" ? `<div class="card flat stack"><div class="eyebrow">Your daily targets</div>${ownTargetFields(d.own || {})}</div>` : ""}`; }
  if (id === "known") body = `<div class="obtitle">Anything measured already?</div><p class="sub">All optional. Measured data beats formulas, so add what you have.</p>${knownDataFields(d)}`;
  if (id === "routine") body = `<div class="obtitle">Your routine</div><p class="sub">Reminders learn your meal times from what you log. Until then they estimate from when you wake and sleep, and they stay quiet outside those hours.</p>${routineFields(d.routine)}
    <label class="toggle"><span>Meal reminders</span><button class="switch" id="obrem" role="switch" aria-checked="${d.reminders !== false}" type="button"></button></label>`;
  if (id === "result") {
    const p = obProfile(); const tg = targetsOf(p, p.weightKg); const e = tg.e; const calc = tg.custom ? targetsOf({ ...p, override: null }, p.weightKg) : null;
    body = `<div class="obtitle">Your plan${d.name ? `, ${esc(d.name)}` : ""}</div>
    <div class="stat3"><div class="stat"><div class="k">BMI</div><div class="v num">${tg.bmi.toFixed(1)}</div><div class="tiny">${bmiCat(tg.bmi)}</div></div>
      <div class="stat"><div class="k">Resting burn</div><div class="v num">${fmt(e.bmr)}</div><div class="tiny">kcal / day</div></div>
      <div class="stat"><div class="k">Daily burn</div><div class="v num">${fmt(e.maint)}</div><div class="tiny">kcal maintenance</div></div></div>
    <div class="card stack" style="gap:8px"><div class="eyebrow">${tg.custom ? "Your own targets" : "Daily target"} · ${esc(tg.phase.t)}</div>
      <div class="row" style="align-items:baseline"><span class="num" style="font-family:var(--font-display);font-stretch:62%;font-weight:900;font-size:64px;line-height:.9">${fmt(tg.kcal)}</span><span class="sub">kcal</span></div>
      <div class="macros" style="margin-top:4px">${[["Protein", tg.protein, "--pro"], ["Carbs", tg.carbs, "--carb"], ["Fat", tg.fat, "--fat"]].map(([n, v, c]) => `<div class="macro"><div class="lbl"><span class="sw" style="background:var(${c})"></span>${n}</div><div class="val num">${v}<small> g</small></div></div>`).join("")}</div>
      ${calc ? `<p class="tiny num">For comparison, Macro's estimate for you is about ${fmt(calc.kcal)} kcal · P ${calc.protein} · C ${calc.carbs} · F ${calc.fat} g (daily burn ~${fmt(e.maint)} kcal). Your targets are used.</p>` : `<p class="tiny num"><b>Protein:</b> ${esc(proteinMath(tg, u))}</p>
      <p class="tiny">${tg.delta === 0 ? "Eating at maintenance." : `${tg.delta > 0 ? "+" : "−"}${fmt(Math.abs(tg.delta))} kcal a day vs maintenance, about ${fmtW(Math.abs(tg.kgWeek), u, 2)} a week.`} Daily burn: ${esc(e.source.toLowerCase())}.</p>`}
      ${tg.floored && !calc ? `<p class="tiny" style="color:var(--warn);font-weight:600">The deficit was capped so you eat at least your resting burn.</p>` : ""}
    </div>
    <p class="sub">You can change any of this later under <b>You</b> without losing logs.</p>`;
  }
  const next = id === "result" ? `<button class="btn primary grow" data-ob="finish">Start tracking</button>` : `<button class="btn primary grow" data-ob="next">${id === "welcome" ? "Get started" : id === "known" ? "Continue" : "Next"}</button>`;
  return `<div class="ob">${step > 0 ? prog : ""}${body}<div class="obfoot">${back}${next}</div></div>`;
}
function obProfile() {
  const d = S.ob.d;
  return { v: 1, onboarded: true, name: (d.name || "").trim().slice(0, 30), units: d.units, sex: d.sex, birthYear: new Date().getFullYear() - d.age, heightCm: round(d.heightCm, 1), weightKg: round(d.weightKg, 2),
    activity: d.activity, phase: d.phase, goal: d.goal, pace: null, goalWeightKg: d.goalWeightKg ?? null, bodyFat: d.bodyFat ?? null, inbody: d.inbody ?? null, maintenance: d.maintenance ?? null, trackerAvg: d.trackerAvg ?? null,
    routine: { ...DEFAULT_ROUTINE, ...d.routine }, reminders: d.reminders !== false, region: regionGuess(), override: d.targetMode === "own" && d.override ? d.override : null, createdAt: Date.now() };
}
function bindOnboarding() {
  const app = $("#app"), ob = S.ob, d = ob.d, id = obSteps(d)[ob.step];
  app.onclick = null;
  const seg = (sel, attr, key) => { const g = $(sel); if (g) g.onclick = e => { const b = e.target.closest(`[data-${attr}]`); if (!b) return; g.querySelectorAll(`[data-${attr}]`).forEach(x => x.setAttribute("aria-pressed", String(x === b))); d[key] = b.dataset[attr]; obSave(); if (key === "units") { d.units = b.dataset.u; } }; };
  seg("[data-units]", "u", "units"); seg("[data-sex]", "s", "sex");
  if (id === "welcome") bindChoices(app, (g, v) => { d.targetMode = v; if (v === "own" && !d.activity) d.activity = "moderate"; obSave(); });
  if (id === "activity") bindChoices(app, (g, v) => { d.activity = v; obSave(); });
  if (id === "goal") bindOwnTargets(app, raw => { d.own = raw; obSave(); });
  if (id === "goal") bindChoices(app, (g, v) => { if ($("#tk")) d.own = readOwnRaw(app); d.phase = v; d.goal = PHASES.find(x => x.id === v).goal; if (d.goal === "maintain") d.goalWeightKg = null; obSave(); render(); });
  if (id === "known") bindKnownData(app, () => ({ ...d }));
  if (id === "routine") { $("#obrem").onclick = e => { const v = e.currentTarget.getAttribute("aria-checked") !== "true"; e.currentTarget.setAttribute("aria-checked", String(v)); d.reminders = v; }; }
  $$("[data-ob]").forEach(b => b.onclick = async () => {
    const act = b.dataset.ob;
    if (act === "back") { ob.step--; obSave(); render(); window.scrollTo(0, 0); return; }
    if (act === "finish") {
      b.disabled = true; b.textContent = "Saving…";
      S.profile = obProfile(); await Store.saveProfile();
      try { localStorage.removeItem("macro.ob"); } catch { }
      S.ob = null; location.hash = "today"; render(); toast("You're set. Log your first meal."); return;
    }
    // validate current step
    if (id === "welcome") { d.name = $("#obname").value; }
    if (id === "body") {
      if (!d.sex) { setErr(app, "sex", "Choose one. It changes the resting-burn equation by about 160 kcal."); return; } else setErr(app, "sex", "");
      const age = $("#age").value, cm = readHeight(app, d.units), kg = dispToKg(parseNum($("#wt").value), d.units);
      let bad = setErr(app, "age", V.age(age)) | setErr(app, "height", V.heightCm(cm)) | setErr(app, "w", V.weightKg(kg));
      if (!bad) bad = setErr(app, "w", V.bmi(kg, cm));
      if (bad) return;
      d.age = parseNum(age); d.heightCm = cm; d.weightKg = kg;
    }
    if (id === "activity" && !d.activity) { setErr(app, "act", "Pick the closest match."); return; }
    if (id === "goal") {
      if (!d.phase) { setErr(app, "goal", "Pick a phase."); return; }
      const ga = goalAllowed(d.goal, bmiOf(d.weightKg, d.heightCm)); if (setErr(app, "goal", ga)) return;
      const gi = $("#gw"); const gw = gi && gi.value.trim() ? dispToKg(parseNum(gi.value), d.units) : null;
      if (gi && gi.value.trim() && !isFinite(gw)) { setErr(app, "gw", "Goal weight needs a number."); return; }
      if (setErr(app, "gw", V.goalWeight(gw, d.weightKg, d.heightCm, d.goal))) return;
      d.goalWeightKg = gw;
      if (d.targetMode === "own") { d.own = readOwnRaw(app); const r = parseOwnTargets(d.own); if (setErr(app, "t", r.err)) return; d.override = r.t; } else d.override = null;
    }
    if (id === "known") {
      const tmp = { ...d, birthYear: new Date().getFullYear() - d.age };
      const r = readKnownData(app, tmp, d.weightKg); if (!r) return; Object.assign(d, r);
    }
    if (id === "routine") { const rr = readRoutine(app); if (!rr) return; d.routine = { ...d.routine, ...rr }; }
    ob.step++; obSave(); render(); window.scrollTo(0, 0);
  });
}

   Boot
   ========================================================= */
Store.init();
</script>
